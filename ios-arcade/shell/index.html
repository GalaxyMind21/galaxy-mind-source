<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12110F">
<title>Bitcoin Games</title>
<link rel="stylesheet" href="/launcher.css">
<script src="/gm/config.js"></script>
<script src="/gm/app.js"></script>
</head>
<body>
<div class="wrap">
  <button type="button" class="brand" id="site">Galaxy Mind</button>
  <h1>Bitcoin Games</h1>
  <p class="lede">Eight games on this device. No ads, no account, no wallet. Scores are play points, not bitcoin.</p>
  <div class="grid" id="grid"></div>
  <button type="button" class="more" id="more">
    <span class="more-title">More at galaxymind.space</span>
    <span class="more-body">Vendor directory, buying gauge, and the supply clock.</span>
  </button>
  <div class="foot">
    <button type="button" id="privacy">Privacy</button>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2>Play points only</h2>
    <p>These games are free. A score called sats is a play point. This app does not pay bitcoin, sell anything, show ads, or run a contest.</p>
    <button type="button" id="accept">Play</button>
  </div>
</div>
<script src="/launcher.js"></script>
</body>
</html>
