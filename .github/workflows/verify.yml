name: verify

# Runs on every PR to main and on every push to main. There is no push trigger for PR branches, so a
# PR push runs this suite once (pull_request), never twice.
#
# Minutes trim (2026-10-19):
#  - PR runs: a newer push to the same PR cancels the older in-progress run (concurrency below).
#  - Push to main: most squash merges produce exactly the tree the PR run already verified. When a
#    successful same-repo PR run of THIS workflow recorded that exact tree (verify-ok-<tree> artifact),
#    the main run reports success without re-running the suite. Any other case (main moved, no
#    record, fork PR, direct push, any API error) runs the full suite. Identical tree = identical
#    inputs, including this workflow file and package.json's verify script.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the tree.
permissions:
  contents: read

concurrency:
  # One group per PR (cancel superseded pushes); one group per commit on main (never cancel or queue).
  group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Typical run is 2-4 minutes; a hang should not burn more than this.
    timeout-minutes: 15
    permissions:
      contents: read
      # Read workflow runs and artifacts for the main-push dedupe check.
      actions: read
    steps:
      - name: Main push, check whether this exact tree already passed verify on its PR
        id: dedupe
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          skip=false
          repo="${GITHUB_REPOSITORY}"
          tree="$(gh api "repos/${repo}/git/commits/${GITHUB_SHA}" --jq '.tree.sha' 2>/dev/null)" || tree=""
          if printf '%s' "$tree" | grep -Eq '^[0-9a-f]{40}$'; then
            run_ids="$(gh api "repos/${repo}/actions/artifacts?name=verify-ok-${tree}&per_page=20" \
              --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' 2>/dev/null)" || run_ids=""
            for id in $run_ids; do
              case "$id" in (*[!0-9]*|"") continue ;; esac
              ok="$(gh api "repos/${repo}/actions/runs/${id}" --jq \
                "select(.path == \".github/workflows/verify.yml\" and .event == \"pull_request\" and .conclusion == \"success\" and .head_repository.full_name == \"${repo}\") | .html_url" 2>/dev/null)" || ok=""
              if [ -n "$ok" ]; then
                echo "Tree ${tree} already passed verify in ${ok}. Skipping the duplicate suite."
                skip=true
                break
              fi
            done
          fi
          if [ "$skip" != "true" ]; then
            echo "No successful PR verify recorded for this exact tree. Running the full suite."
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.dedupe.outputs.skip != 'true'
        with:
          persist-credentials: false
      - name: Check distribution certificate packaging
        if: steps.dedupe.outputs.skip != 'true'
        run: ruby ios-arcade/scripts/test-p12-export.rb
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.dedupe.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.dedupe.outputs.skip != 'true'
      - run: npm run verify
        if: steps.dedupe.outputs.skip != 'true'

      # PR runs only, and only after everything above passed: record the tested tree (the PR merge
      # checkout) so the main-push run of the same tree can skip the duplicate suite.
      - name: Record verified tree
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/verify-ok"
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$tree" > "${RUNNER_TEMP}/verify-ok/tree.txt"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: verify-ok-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/verify-ok/tree.txt
          retention-days: 7
          if-no-files-found: error
