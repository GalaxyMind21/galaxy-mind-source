# Weekly dependency update PRs, grouped and kept small. Dependabot only opens PRs; each one still
# has to pass verify and secret-scan before it can merge. Alerts and security updates are repo settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /ios-arcade
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      ios-npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(ios)"

  - package-ecosystem: bundler
    directory: /ios-arcade
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(ios)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
